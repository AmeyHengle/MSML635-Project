[project]
name = "router-bandit"
version = "0.1.0"
description = "Adaptive model selection for LLMs using contextual bandits (MSML635 Group 13)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Amey Hengle", email = "ameyhen@umd.edu" },
  { name = "Sawyer Byrd", email = "sbyrd1@umd.edu" },
  { name = "Sujeet Madihalli", email = "sujeet@umd.edu" },
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "matplotlib>=3.9",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=5.0", "torch>=2.2"]
data = ["datasets>=3.0", "huggingface-hub>=0.26", "pyarrow>=17.0"]
dev = [
    "ipykernel>=7.4.0",
    "jinja2>=3.1.6",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/router_bandit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
